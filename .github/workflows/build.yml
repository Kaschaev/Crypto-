name: Build Android APK & Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies & Build APK
        run: |
          # Устанавливаем плагины для уже готового проекта из репозитория
          flutter pub add http shared_preferences url_launcher home_widget
          
          # Сборка APK из вашего lib/main.dart
          flutter build apk --release
          mkdir -p /home/runner/artifact_out
          cp build/app/outputs/flutter-apk/app-release.apk /home/runner/artifact_out/app-release.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-Android-APK
          path: /home/runner/artifact_out/app-release.apk

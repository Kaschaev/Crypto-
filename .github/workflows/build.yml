name: Build Android APK & Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Inject Code
        run: |
          # Создаем проект во временной директории, чтобы избежать конфликтов
          flutter create --org com.cryptopulse --project-name cryptopulse_ai /tmp/app_project
          cd /tmp/app_project

          # Устанавливаем необходимые плагины
          flutter pub add http shared_preferences url_launcher home_widget

          # Записываем код main.dart
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:home_widget/home_widget.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const CryptoPulseApp());
          }

          class CryptoPulseApp extends StatefulWidget {
            const CryptoPulseApp({super.key});

            @override
            State<CryptoPulseApp> createState() => _CryptoPulseAppState();
          }

          class _CryptoPulseAppState extends State<CryptoPulseApp> {
            ThemeMode _themeMode = ThemeMode.dark;

            void _toggleTheme() {
              setState(() {
                _themeMode = _themeMode == ThemeMode.dark ? ThemeMode.light : ThemeMode.dark;
              });
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'CryptoPulse AI',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(brightness: Brightness.light, useMaterial3: true, scaffoldBackgroundColor: const Color(0xFFF4F7FB)),
                darkTheme: ThemeData(brightness: Brightness.dark, useMaterial3: true, scaffoldBackgroundColor: const Color(0xFF0D1117)),
                themeMode: _themeMode,
                home: const HomeScreen(),
              );
            }
          }

          class CoinModel {
            final String id, symbol, name;
            double price, change24h;
            int rank;
            CoinModel({required this.id, required this.symbol, required this.name, this.price = 0, this.change24h = 0, this.rank = 1});
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            List<CoinModel> _coins = [
              CoinModel(id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', price: 89000, change24h: 1.5, rank: 1),
              CoinModel(id: 'ethereum', symbol: 'ETH', name: 'Ethereum', price: 3100, change24h: 0.9, rank: 2),
              CoinModel(id: 'the-open-network', symbol: 'TON', name: 'Toncoin', price: 5.4, change24h: 2.3, rank: 9),
            ];
            late CoinModel _selectedCoin;
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _selectedCoin = _coins.first;
              _refresh();
            }

            Future<void> _refresh() async {
              setState(() => _loading = true);
              try {
                final res = await http.get(Uri.parse('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50'));
                if (res.statusCode == 200) {
                  final List data = jsonDecode(res.body);
                  setState(() {
                    _coins = data.map((e) => CoinModel(
                      id: e['id'], symbol: e['symbol'].toString().toUpperCase(), name: e['name'],
                      price: (e['current_price'] as num).toDouble(), change24h: (e['price_change_percentage_24h'] as num?)?.toDouble() ?? 0,
                      rank: e['market_cap_rank'] ?? 99,
                    )).toList();
                    _selectedCoin = _coins.first;
                  });
                }
              } catch (_) {}
              await _updateWidget();
              if (mounted) setState(() => _loading = false);
            }

            Future<void> _updateWidget() async {
              try {
                await HomeWidget.saveWidgetData<String>('coin_name', '${_selectedCoin.name} (${_selectedCoin.symbol})');
                await HomeWidget.saveWidgetData<String>('coin_price', '\$${_selectedCoin.price.toStringAsFixed(2)} (${_selectedCoin.change24h >= 0 ? "+" : ""}${_selectedCoin.change24h.toStringAsFixed(2)}%)');
                await HomeWidget.saveWidgetData<String>('signal_verdict', 'ПОКУПАТЬ (ЛОНГ)');
                await HomeWidget.updateWidget(name: 'CryptoWidgetProvider', androidName: 'CryptoWidgetProvider');
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('${_selectedCoin.name} (${_selectedCoin.symbol})')),
                body: ListView(
                  padding: const EdgeInsets.all(14),
                  children: [
                    if (_loading) const LinearProgressIndicator(),
                    const SizedBox(height: 10),
                    Text('\$${_selectedCoin.price.toStringAsFixed(2)}', style: const TextStyle(fontSize: 32, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 15),
                    FilledButton(
                      child: const Text('Обновить виджет Android'),
                      onPressed: _updateWidget,
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          # Инъекция файлов нативного виджета Android
          RES_DIR="android/app/src/main/res"
          mkdir -p "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          cat << 'EOF' > "$RES_DIR/drawable/widget_bg.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#161B22"/>
              <corners android:radius="16dp"/>
              <stroke android:width="1dp" android:color="#EAB308"/>
          </shape>
          EOF

          cat << 'EOF' > "$RES_DIR/layout/crypto_widget.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
              <TextView android:id="@+id/tv_coin_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="CryptoPulse" android:textColor="#EAB308" android:textStyle="bold"/>
              <TextView android:id="@+id/tv_coin_price" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="$0.00" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold"/>
              <TextView android:id="@+id/tv_signal" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ПОКУПАТЬ" android:textColor="#22C55E" android:textStyle="bold"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > "$RES_DIR/xml/crypto_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp" android:minHeight="110dp" android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/crypto_widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" />
          EOF

          KT_DIR="android/app/src/main/kotlin/com/cryptopulse/cryptopulse_ai"
          mkdir -p "$KT_DIR"
          cat << 'EOF' > "$KT_DIR/CryptoWidgetProvider.kt"
          package com.cryptopulse.cryptopulse_ai
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetProvider

          class CryptoWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray, widgetData: SharedPreferences) {
                  appWidgetIds.forEach { widgetId ->
                      val views = RemoteViews(context.packageName, R.layout.crypto_widget).apply {
                          setTextViewText(R.id.tv_coin_name, widgetData.getString("coin_name", "Bitcoin"))
                          setTextViewText(R.id.tv_coin_price, widgetData.getString("coin_price", "\$0.00"))
                          setTextViewText(R.id.tv_signal, widgetData.getString("signal_verdict", "ПОКУПАТЬ"))
                          val intent = Intent(context, MainActivity::class.java)
                          setOnClickPendingIntent(R.id.widget_root, PendingIntent.getActivity(context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      }
                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          EOF

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/g' "$MANIFEST"
          RECEIVER_XML='<receiver android:name=".CryptoWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" \/><\/intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml\/crypto_widget_info" \/><\/receiver><\/application>'
          sed -i "s/<\/application>/$RECEIVER_XML/g" "$MANIFEST"

          # Сборка APK
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /home/runner/work/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-Android-APK
          path: /home/runner/work/app-release.apk
